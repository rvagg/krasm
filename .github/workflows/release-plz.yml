name: Release PLZ

on:
  push:
    branches: master
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz-master
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'rvagg/krasm' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.metadata.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
        env:
          BINSTALL_VERSION: 1.26.0
      - name: Install release-plz
        run: cargo binstall release-plz@0.3.174 --force --strategies=crate-meta-data,compile --no-confirm
      - name: Calculate release metadata
        run: release-plz update --config release-plz.toml
      - name: Retain release metadata
        id: metadata
        shell: bash
        run: |
          python3 -I scripts/release_pr.py export \
            --source "$GITHUB_WORKSPACE" --base "$GITHUB_SHA" \
            --artifact "$RUNNER_TEMP/release-metadata/release-metadata.json"
      - name: Upload metadata
        if: steps.metadata.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-metadata/release-metadata.json
          if-no-files-found: error
          retention-days: 7

  propose:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check artifact identity and compressed size
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/release_pr.py artifact \
            --source "$GITHUB_WORKSPACE" --base "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          skip-decompress: true
          path: ${{ runner.temp }}/release-metadata
      - name: Open or update the release PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/release_pr.py propose \
            --source "$GITHUB_WORKSPACE" --base "$GITHUB_SHA" \
            --artifact "$RUNNER_TEMP/release-metadata"
